<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U60 · Compact nut mounts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ef;color:#20242a;font:15px system-ui,sans-serif}header{padding:22px 28px 15px;border-bottom:1px solid #d8d9d8}h1{font-size:24px;margin:0 0 5px;letter-spacing:-.6px}p{margin:4px 0;color:#5e636a;line-height:1.5}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}button{border:1px solid #c7c9cc;border-radius:7px;background:#fff;padding:9px 15px;color:#262c32;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#26343b;color:#fff;border-color:#26343b}label{display:flex;align-items:center;gap:9px;margin-left:12px}input{width:140px;accent-color:#c76213}#canvas{height:calc(100dvh - 250px);min-height:300px;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:10px;left:28px;font-size:12px;color:#6b7075;pointer-events:none}footer{padding:15px 28px;background:#fff;border-top:1px solid #d8d9d8;min-height:92px}#caption{font-weight:650;color:#282e34}#status{font-size:13px}#error{position:absolute;inset:30px;color:#a33122;white-space:pre-wrap}small{display:block;color:#74787d;font-size:12px;margin-top:9px}@media(max-width:600px){header{padding:15px}h1{font-size:21px}label{margin:5px 0 0;width:100%}#canvas{height:50dvh;min-height:270px}footer{padding:15px}.hint{left:15px;font-size:11px}button{padding:8px 11px}}
</style>
<header><h1>U60 / Compact nut mounts</h1><p>Small screw-corner pads conceal four M2 nuts. The motor side keeps its original outline.</p><div class="controls"><button data-mode="original" aria-pressed="false">Original</button><button data-mode="trial" aria-pressed="true">Compact revision</button><button data-mode="detail" aria-pressed="false">Nut detail</button><button id="reset">Reset view</button><label>Stroke <input id="stroke" type="range" min="0" max="60" value="30"><output id="travel">30 mm</output></label></div></header>
<div id="canvas"><div class="hint">Drag to rotate · Scroll / pinch to zoom · Right drag to pan</div></div>
<footer><p id="caption">Loading…</p><p id="status"></p><small>CAD and appearance trial. Printed fit, load capacity and clearance in the excavator arm remain unverified.</small></footer>
<script>__THREE__</script><script>__ORBIT__</script>
<script>
const packed="__PAYLOAD__";
(async()=>{
const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
const data=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const host=document.querySelector('#canvas'),scene=new THREE.Scene();scene.background=new THREE.Color('#f3f2ef');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;host.append(renderer.domElement);
const camera=new THREE.OrthographicCamera(-110,110,60,-60,.1,2000);camera.up.set(0,0,1);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=false;
scene.add(new THREE.HemisphereLight(0xffffff,0x6c7784,1.1));
for(const [p,power] of [[[0,-90,150],1.2],[[0,100,80],.6],[[-150,-30,40],.4]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(...p);scene.add(l)}
const objects=[];let mode='trial',stroke=30;
for(const group of ['common','original','trial'])for(const it of data[group]){
 const geo=new THREE.BufferGeometry(),verts=new Float32Array(it.vertices.length*3);
 it.vertices.forEach((v,i)=>{verts[3*i]=v[2]-47.5;verts[3*i+1]=v[0]-1.7;verts[3*i+2]=v[1]});
 geo.setAttribute('position',new THREE.BufferAttribute(verts,3));geo.setIndex(it.triangles.flat());geo.computeVertexNormals();
 const metal=it.material==='steel'||it.material==='silver',mat=new THREE.MeshStandardMaterial({color:new THREE.Color(...it.color).convertSRGBToLinear(),metalness:metal?.55:0,roughness:metal?.32:.45});
 const obj=new THREE.Mesh(geo,mat);obj.userData={...it,group};scene.add(obj);objects.push(obj);
}
function render(){renderer.render(scene,camera)}
function resize(){const w=host.clientWidth,h=host.clientHeight,scale=mode==='detail'?76:220;renderer.setSize(w,h,false);camera.left=-scale/2;camera.right=scale/2;camera.top=scale*h/w/2;camera.bottom=-scale*h/w/2;camera.updateProjectionMatrix();render()}
function reset(){camera.zoom=1;if(mode==='detail'){camera.position.set(160,180,150);controls.target.set(37,6,0)}else{camera.position.set(-60,190,105);controls.target.set(-5,0,0)}camera.lookAt(controls.target);controls.update();resize()}
function update(){
 for(const o of objects){const d=o.userData,n=d.name;o.position.set(d.moving?stroke:0,0,0);o.visible=false;
  if(mode==='detail'&&d.group==='trial'){
   if(n==='detail_front_band')o.visible=true;
   else if(n==='02_front_cap'){o.visible=true;o.position.x=18}
   else if(n.startsWith('M2_nut_front_')){o.visible=true;o.position.y=9}
   else if(n.startsWith('M2x8_front_cap_')){o.visible=true;o.position.x=24}
  }else if(mode!=='detail')o.visible=(d.group==='common'||d.group===mode)&&d.kind!=='detail';
 }
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 document.querySelector('#stroke').disabled=mode==='detail';
 document.querySelector('#caption').textContent=mode==='original'?'Original · 16.1 × 14.7 mm body':mode==='trial'?'Compact · +1.3 mm on PCB side, +1.7 mm at screw corners':'Side-entry nuts · narrow cap fingers cover the slots';
 document.querySelector('#status').textContent=mode==='detail'?'Front end shown exploded. M2 nuts bear against a 2.4 mm printed shoulder.':`60 mm stroke · ${140+stroke} mm between pins · ${mode==='trial'?'Maximum local envelope: 17.4 × 18.1 mm.':'End-cap screws engage plastic pilot holes.'}`;
 document.querySelector('#travel').textContent=stroke+' mm';window.trialState={mode,stroke,visible:objects.filter(o=>o.visible).length};render();
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const wasDetail=mode==='detail';mode=b.dataset.mode;update();if(wasDetail||mode==='detail')reset()}));
document.querySelector('#reset').onclick=reset;
document.querySelector('#stroke').oninput=e=>{stroke=Number(e.target.value);update()};
controls.addEventListener('change',render);window.addEventListener('resize',resize);update();reset();window.trialReady=true;
})().catch(e=>{document.querySelector('#caption').textContent='Preview could not load';const el=document.createElement('div');el.id='error';el.textContent=e.message+'\nUse a current browser with WebGL and gzip decompression support.';document.querySelector('#canvas').append(el);console.error(e)});
</script>
</html>
