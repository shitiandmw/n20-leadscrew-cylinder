// The links are joined into one flat strip with one joint left open, on the bench under the lifted track; the track is set down on the
// strip; the rear end is wrapped round the sprocket and, with the idler held back at its recoil stop, the front end round the idler;
// the last pin goes in from outboard where the two ends meet on top. Wrapping bends each joint from straight to its CAD angle, in
// turn outward from the link that stays on the bottom run, so the free end stays straight and tangent to the wheel (C.chain_anim).
// Each joint of the strip is made as a person can: the next link is put down ahead of the strip's end and pushed back along it (its
// rounded plate ends slide into the last link's hollowed ones); the bushing drops in between the inner ears from above (it cannot pass
// the pin holes); the pin goes through from outboard; the E-clips go on square to the pin, open side first. The far end's free ears
// take the last bushing, held by a dummy pin; the front end comes over in a low arch, lands short and is pressed flat along the run;

const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);

 for(let j=a0,n=(a0+1)%N;n!==o;j=n,n=(n+1)%N){th[n]=th[j]+wb(n);A[n]=[A[j][0]+LEN[j]*Math.cos(th[j]),A[j][1]+LEN[j]*Math.sin(th[j])]}

 const m=M.byName[l.part]||chassisByName[l.part];if(!m||!m.visible||!m.parent.visible||(m.userData.side===0&&!chassisGroup.visible)||(m.userData.side!==0&&!M.g.visible))return null;
 const o=m.userData.off;V.set(l.at[0]+o[1],l.at[1]+o[2],l.at[2]+o[3]);return (m.userData.side===0?chassisGroup:M.g).localToWorld(V)}
function updateLabels(){const w=stage.clientWidth,h=stage.clientHeight,cap=document.getElementById('caption').offsetHeight;camera.updateMatrixWorld();
 const items=[];for(const e of labelEls){const p=anchorWorld(e.l);if(!p){e.el.style.display='none';e.shown=false;continue}p.project(camera);
  if(p.z>1||p.x<-1.1||p.x>1.1||p.y<-1.1||p.y>1.1){e.el.style.display='none';e.shown=false;continue}
  e.el.style.display='block';const ax=(p.x+1)/2*w,ay=(1-p.y)/2*h;items.push({e,ax,ay,bw:e.el.offsetWidth,bh:e.el.offsetHeight})}
 for(const it of items){it.x=it.ax+(it.ax>w*.62?-it.bw-22:22);it.y=it.ay-it.bh-18}
 items.sort((a,b)=>a.y-b.y);
 for(let i=0;i<items.length;i++){const a=items[i];a.x=Math.max(4,Math.min(w-a.bw-4,a.x));a.y=Math.max(4,Math.min(h-cap-a.bh-30,a.y));
  for(let j=0;j<i;j++){const b=items[j];if(a.x<b.x+b.bw+4&&b.x<a.x+a.bw+4&&a.y<b.y+b.bh+3)a.y=b.y+b.bh+3}}
 let s='';for(const it of items){it.e.el.style.transform=`translate(${Math.round(it.x)}px,${Math.round(it.y)}px)`;it.e.shown=true;it.e.box=[it.x,it.y,it.bw,it.bh];it.e.anchor=[it.ax,it.ay];
  const ex=it.x+(it.x+it.bw/2<it.ax?it.bw:0),ey=it.y+it.bh/2;
  s+=`<line x1="${it.ax}" y1="${it.ay}" x2="${ex}" y2="${ey}" stroke="#18333c" stroke-width="1.3"/><circle cx="${it.ax}" cy="${it.ay}" r="3.2" fill="#e08a1e" stroke="#18333c" stroke-width="1"/>`}
 svg.innerHTML=s}
// ------------------------------------------------------------------ panel
const $=id=>document.getElementById(id);
function itemName(id){const i=ITEMS[id];if(!i)return id;if(id==='J901'||id==='J909'){if(mode==='right')return i.name+' (right, mirrored print)';if(mode==='x1')return i.name+' (left and right prints)'}return i.name}
function itemFile(id){const i=ITEMS[id];if(!i||!i.files)return '';return mode==='right'&&i.files.right?i.files.right:i.files.left||i.files.both||i.files.chassis}
function chip([id,q]){const i=ITEMS[id]||{type:'standard'};const f=itemFile(id);return `<span class="chip ${i.type}"${f?` title="${esc(f)}"`:''}><b>${q}&times;</b> ${esc(itemName(id))}<i>${i.type==='printed'?'print':'buy'}</i></span>`}
function renderList(){$('steplist').innerHTML=list.map((s,i)=>`<li data-i="${i}" class="${i===cur?'cur':''}${s.skip?' skip':''}"${s.skip?' title="Only when mounting on X101: click to switch to Both on X101"':''}><span class="k">${i}</span><span>${esc(s.title)}${s.x1only?'<em class="badge">X101 only</em>':''}</span></li>`).join('');
 $('bars').innerHTML=list.map((s,i)=>`<i data-i="${i}" title="${i}. ${esc(s.title)}${s.skip?' (X101 only)':''}" class="${i===cur?'cur':''}${s.skip?' skip':''}"><span></span></i>`).join('')}
function renderCard(){const st=list[cur],per=st.id==='xframe'?'whole chassis':(mode==='x1'?'each track':'per track');
 $('card').innerHTML=`<h2>${cur}. ${esc(st.title)}${st.x1only?'<em class="badge">X101 only</em>':''}</h2>`+
  (st.items.length?`<h3>Fit in this step (${per})</h3><div class="chips">${st.items.map(chip).join('')}</div>`:'')+
  `<h3>${st.id==='overview'?'Before you start':'Do'}</h3><ol>${st.do.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`+
  (st.check.length?`<h3>Check</h3><ul class="check">${st.check.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')+
  (st.tools.length?`<p class="tools"><b>Tools:</b> ${st.tools.map(esc).join(', ')}</p>`:'')+`<p class="src">From ${esc(st.source)}</p>`;
 $('capNum').textContent=cur+'.';$('capTitle').textContent=st.title;$('capText').textContent=st.caption}
function syncProgress(){const bars=$('bars').children;for(let i=0;i<bars.length;i++)bars[i].firstChild.style.transform=`scaleX(${i<cur?1:i>cur?0:t})`;$('scrub').value=Math.round(t*1000)}
function syncPlay(){$('play').innerHTML=playing?'&#10074;&#10074; Pause':'&#9654; Play'}
function go(i,dir){dir=dir||1;i=Math.max(0,Math.min(list.length-1,i));while(list[i]&&list[i].skip)i+=dir;if(!list[i])i=cur;cur=i;t=0;hold=0;camIdx=-1;userCam=false;update();camFollow(false);buildLabels();renderList();renderCard();syncProgress()}
function setMode(m,to){const at=to===undefined?cur:to;mode=m;list=stepsFor(m);
 L.g.position.set(0,m==='x1'?C.track_y:0,0);R.g.position.set(0,m==='x1'?-C.track_y:0,0);
 if(m==='x1'){ground.scale.set(780,640,1);ground.position.set(0,0,-.05)}else{ground.scale.set(780,280,1);ground.position.set(0,m==='right'?10:-10,-.05)}
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));go(at,-1)}
function setPlaying(p){playing=p;if(p&&t>=1&&!list[cur].run){if(cur<list.length-1)go(cur+1,1);else go(0)}syncPlay()}
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});
const pick=i=>{if(list[i].skip)setMode('x1',i);else go(i)};
$('steplist').addEventListener('click',e=>{const li=e.target.closest('li');if(li)pick(+li.dataset.i)});
$('bars').addEventListener('click',e=>{const b=e.target.closest('i');if(b)pick(+b.dataset.i)});
$('prev').addEventListener('click',()=>go(cur-1,-1));$('next').addEventListener('click',()=>go(cur+1,1));$('play').addEventListener('click',()=>setPlaying(!playing));
$('speed').addEventListener('change',e=>speed=+e.target.value);$('auto').addEventListener('change',e=>auto=e.target.checked);
$('scrub').addEventListener('input',e=>{t=+e.target.value/1000;update();camFollow(false)});
window.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}else if(e.key==='ArrowRight')go(cur+1,1);else if(e.key==='ArrowLeft')go(cur-1,-1)});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
 $('tab-steps').hidden=b.dataset.tab!=='steps';$('tab-parts').hidden=b.dataset.tab!=='parts'});
// click to identify
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;const r=renderer.domElement.getBoundingClientRect();
 mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
 const objs=[];root.traverseVisible(o=>{if(o.isMesh)objs.push(o)});const hit=ray.intersectObjects(objs,false)[0];
 if(!hit){$('part').innerHTML='<small>Click a part in the 3D view to identify it.</small>';return}
 const u=hit.object.userData,id=u.p?u.p.item:u.item,i=ITEMS[id],side=u.side>0?'left track':u.side<0?'right track':'chassis';
 const nm=u.p?u.p.name:({J910:`J910 shoe, link ${u.link+1} of ${N}`,trackpin:`pin, joint ${u.link+1} of ${N}`,bushing:`bushing, joint ${u.link+1} of ${N}`,
  clip:`E-clip, joint ${u.link+1} of ${N}, ${u.clipSide<0?'inboard':'outboard'}`,dummy:'removed again: the last pin pushes it out'})[u.item];
 let f='';if(i&&i.files)f=u.side<0&&i.files.right?i.files.right:i.files.left||i.files.both||i.files.chassis||'';
 $('part').innerHTML=`<b>${esc(i?i.name:id)}</b> <span class="badge">${i&&i.type==='printed'?'print':i&&i.type==='tool'?'tool':'buy'}</span><br><small>${esc(nm)} &middot; ${side}</small>`+
  (f?`<br><small>STL: <code>${esc(f)}</code></small>`:'')+(i?`<br><small>${esc(i.spec||i.settings||'')}</small>`:'')});
// ------------------------------------------------------------------ parts list tab
function partsTab(){const T=KIT.totals,two='for two tracks';
 const pr=KIT.printed.flatMap(i=>Object.entries(i.files).map(([side,f])=>{const q=side==='both'?2*i.per_track:i.per_track,fa=i.facts[side];
  return `<tr><td>${esc(i.name)}${side==='left'?' <small>(left)</small>':side==='right'?' <small>(right, mirrored)</small>':''}<br><small>${esc(i.note)}</small></td><td class="q">${q}</td><td><code>${esc(f.replace('track_wheel_jgy370/',''))}</code><br><small>${fa.size_mm.join(' x ')} mm</small></td><td>${esc(i.settings)}<br><small>${esc(i.orientation)}</small></td></tr>`})).join('');
 const opt=KIT.optional.map(i=>`<tr><td>${esc(i.name)}</td><td class="q">${i.per_machine}</td><td><code>${esc(i.files.chassis.replace('track_wheel_jgy370/',''))}</code><br><small>${i.facts.chassis.size_mm.join(' x ')} mm</small></td><td>${esc(i.settings)}<br><small>${esc(i.orientation)}</small></td></tr>`).join('');
 const buy=rows=>rows.map(i=>`<tr><td>${esc(i.name)}</td><td class="q">${i.per_machine||2*i.per_track}${i.buy?` <small>(${esc(i.buy)})</small>`:''}</td><td>${esc(i.spec)}</td></tr>`).join('');
 const cats=[...new Set(KIT.standard.map(i=>i.cat))];
 $('tab-parts').innerHTML=`<div class="sum"><b>Print ${T.printed_pieces} parts + ${T.shoes} shoes</b> (${T.printed_files} STL files) &middot; <b>buy ${T.bought} standard parts</b> + chain hardware. All quantities are ${two}.</div>`+
  `<h2>Parts to print</h2><table><tr><th>Part</th><th>Prints</th><th>STL file and size</th><th>Settings and orientation</th></tr>${pr}</table>`+
  `<p><small>Only to test the tracks on the chassis:</small></p><table><tr><th>Part</th><th>Prints</th><th>STL file and size</th><th>Settings and orientation</th></tr>${opt}</table>`+
  `<h2>Print notes</h2><ul>${KIT.notes.map(([h,x,sub])=>`<li><b>${esc(h)}</b> ${esc(x)}${sub.length?`<ul>${sub.map(y=>`<li>${esc(y)}</li>`).join('')}</ul>`:''}</li>`).join('')}</ul>`+
  cats.map(c=>`<h2>${esc(c)}</h2><table><tr><th>Part</th><th>Qty</th><th>Notes</th></tr>${buy(KIT.standard.filter(i=>i.cat===c))}</table>`).join('')+
  `<h2>Track chain</h2><table><tr><th>Part</th><th>Qty</th><th>Notes</th></tr>${buy(KIT.chain)}</table>`+
  `<h2>Only to mount the tracks on X101</h2><table><tr><th>Part</th><th>Qty</th><th>Notes</th></tr>${buy(KIT.joint)}</table>`+
  `<h2>First powered test (not in the CAD)</h2><table><tr><th>Part</th><th>Qty</th><th>Notes</th></tr>${KIT.bench.map(i=>`<tr><td>${esc(i.name)}</td><td class="q">${esc(i.qty)}</td><td>${esc(i.spec)}</td></tr>`).join('')}</table>`+
  `<h2>Tools</h2><table><tr><th>Tool</th><th>For</th></tr>${KIT.tools.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>`+
  `<h2>Still to verify on the real parts</h2><ul>${KIT.verify.map(([a,b])=>`<li><b>${esc(a)}</b> ${esc(b)}</li>`).join('')}</ul>`}
// ------------------------------------------------------------------ loop
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true}window.addEventListener('resize',resize);
function render(){renderer.render(scene,camera);updateLabels();dirty=false}
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing){const st=list[cur];
  if(st.run){runPhase=(runPhase+dt*1.2*speed)%N;t=Math.min(1,t+dt*speed/st.dur);update();syncProgress()}
  else if(t<1){t=Math.min(1,t+dt*speed/st.dur);update();camFollow(false);syncProgress()}
  else if(auto&&cur<list.length-1){hold+=dt;if(hold>.9){go(cur+1,1)}}
  else{playing=false;syncPlay()}}
 if(camTween){const f=ease((now-camTween.s)/camTween.d);camera.position.lerpVectors(camTween.p0,camTween.p1,f);controls.target.lerpVectors(camTween.q0,camTween.q1,f);controls.update();if(f>=1)camTween=null;dirty=true}
 if(dirty)render();requestAnimationFrame(loop)}
partsTab();resize();setMode('left',0);flyTo(camsFor(list[0])[0],0);requestAnimationFrame(loop);
window.kit={meta:()=>({steps:ALL.map(s=>({id:s.id,title:s.title,x1only:!!s.x1only,labels:(s.labels||[]).length,windows:(s.labels||[]).filter(l=>l.t0!==undefined).map(l=>({text:l.text,t0:l.t0,t1:l.t1}))})),chain:CHAIN,links:N,
  first:Object.fromEntries(DATA.unit.map(p=>[p.name,Math.min(...p.anim.map(e=>e.s))])),last:Object.fromEntries(DATA.unit.map(p=>[p.name,Math.max(...p.anim.map(e=>e.s))])),
  chassis:DATA.chassis.map(p=>p.name),spring:C.spring,yokeRest:C.yoke_rest,trackY:C.track_y,
  chainWindows:[[CA.links[1][0],CA.clips[1][1],400],[CA.links[2][0],CA.clips[3][1],150],[CA.bush[0][0],CA.dummy.t[1],100],[CA.arch.on[0],CA.arch.off[1],400],[CA.pin[0][0],CA.clips[0][1],200]],
  hw:Object.fromEntries(Object.keys(HW).map(k=>{HW[k].computeBoundingBox();const b=HW[k].boundingBox;return [k,[b.min.x,b.min.y,b.min.z,b.max.x,b.max.y,b.max.z]]}))}),setMode,go,setT:x=>{t=x;update();camFollow(true);render()},play:()=>setPlaying(true),pause:()=>setPlaying(false),render,
 snap:()=>{userCam=false;camFollow(true);render()},
 probe:x=>{t=x;update();return {t:x,lift:root.position.z,mods:mods().map(M=>({slide:M.yoke.userData.off[1],
  shoes:M.shoes.map(s=>[+s.visible,s.position.x,s.position.z,-s.rotation.y]),pins:M.pins.map(q=>[+q.visible,q.position.x,q.position.y,q.position.z]),
  bushes:M.bushes.map(q=>[+q.visible,q.position.x,q.position.y,q.position.z]),clips:M.clips.map(q=>[+q.visible,q.position.x,q.position.y,q.position.z,-q.rotation.y]),
  dummy:[+M.dummy.visible,M.dummy.position.x,M.dummy.position.y,M.dummy.position.z]}))}},
 state:()=>{const vis=[],glowing=[],moved=[];for(const M of mods())for(const m of M.meshes)if(m.visible){vis.push(m.userData.p.name);if(m.material.emissive.getHex())glowing.push(m.userData.p.name);
   const o=m.userData.off;if(Math.hypot(o[1],o[2],o[3])>1e-6)moved.push([m.userData.p.name,o.slice(1)])}
  const chas=mode==='x1'?chassis.filter(m=>m.visible).map(m=>[m.userData.p.name,m.userData.off.slice(1)]):[];
  return {mode,step:list[cur].id,index:cur,steps:list.filter(s=>!s.skip).map(s=>s.id),t,playing,visible:vis,glowing,moved,chassis:chas,
   cutaway:mods().map(M=>!!M.byName.J901_H_frame.material.clippingPlanes),lift:root.position.z,
   links:mods().map(M=>M.shoes.filter(s=>s.visible).length),
   hardware:mods().map(M=>[M.pins,M.bushes,M.clips].map(a=>a.filter(m=>m.visible).length).concat(+M.dummy.visible)),spring_scale:mods().map(M=>M.spring.visible?M.spring.scale.x:null),
   labels:labelEls.map(e=>({text:e.l.text,shown:!!e.shown,box:e.box||null,anchor:e.anchor||null})),
   stage:[stage.clientWidth,stage.clientHeight],caption:$('capText').textContent,card:$('card').innerText}}};
